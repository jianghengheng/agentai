services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pythonagent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pythonagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pythonagent"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pythonagent_pgdata:
